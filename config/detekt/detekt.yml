# Detekt configuration (task 49.1).
# `buildUponDefaultConfig = true` is set in app/build.gradle.kts, so this file
# only overrides the defaults it needs to.

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 12 # Hilt/Compose constructors + @Inject can be long
  TooManyFunctions:
    active: false

style:
  MagicNumber:
    active: false # noisy in Compose UI (dp/sp literals)
  UnusedPrivateMember:
    active: true
  MaxLineLength:
    maxLineLength: 120

naming:
  FunctionNaming:
    # Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']

compose:
  # Compose-specific rules require the detekt-compose ruleset (added later);
  # kept documented here as the intended home for them.
